# Telegram order bot edge functions.
# These are called by Postgres (pg_net) and by Telegram, neither of which can send
# a Supabase JWT — they authenticate with their own shared-secret headers instead.
# verify_jwt MUST stay false or the gateway 401s every request before the handler runs.
[functions.telegram-order-sync]
verify_jwt = false

[functions.telegram-webhook]
verify_jwt = false

# Protocol automation edge functions. They authenticate with their own headers
# (signed admin/portal session tokens, or Vault shared secrets for pg_net / PostHog),
# so the gateway JWT check must be off.
[functions.admin-auth]
verify_jwt = false

[functions.protocol-admin]
verify_jwt = false

[functions.protocol-portal]
verify_jwt = false

[functions.protocol-delivery]
verify_jwt = false

[functions.protocol-delivery-status]
verify_jwt = false
